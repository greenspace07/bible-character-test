<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성경 인물 유형 테스트</title>

    <style>
        body{
            margin:0;
            font-family:'Malgun Gothic', sans-serif;
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            background:white;
            width:90%;
            max-width:450px;
            padding:40px 30px;
            border-radius:20px;
            box-shadow:0 10px 25px rgba(0,0,0,0.15);
            text-align:center;
        }

        h1{
            color:#2c3e50;
            margin-bottom:15px;
        }

        p{
            color:#666;
            line-height:1.6;
            margin-bottom:30px;
        }

        input{
            width:100%;
            padding:15px;
            font-size:18px;
            border:1px solid #ccc;
            border-radius:10px;
            box-sizing:border-box;
            margin-bottom:20px;
        }

        button{
            width:100%;
            padding:15px;
            font-size:20px;
            background:#4CAF50;
            color:white;
            border:none;
            border-radius:10px;
            cursor:pointer;
        }

        button:hover{
            background:#3d9441;
        }
    </style>
</head>

<body>

<div class="card">

<h1>📖 성경 인물 유형 테스트</h1>

<p>
당신과 가장 닮은 성경 인물은 누구일까요?<br>
40개의 질문을 통해 알아보세요.
</p>

<input type="text" id="name" placeholder="이름을 입력하세요">

<button onclick="startTest()">테스트 시작하기</button>
</div>
<script>

function startTest(){

    let name = document.getElementById("name").value;

    if(name==""){
        alert("이름을 입력해주세요.");
        return;
    }

    alert(name + "님, 테스트를 시작합니다!");

}

</script>
</body>
</html>

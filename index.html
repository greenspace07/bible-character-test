<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성경 인물 카드 갤러리 (24종)</title>
    <style>
        :root {
            --bg-color: #f7f6f0;
            --card-bg: #ffffff;
            --primary-color: #4a5568;
            --accent-color: #319795;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #2d3748;
            padding: 20px 15px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            padding-top: 10px;
        }

        .header h1 {
            font-size: 1.6rem;
            color: #2c3e50;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 0.95rem;
            color: #718096;
        }

        /* 반응형 카드 그리드 (모바일 2열 기본) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 1000px;
            margin: 0 auto;
        }

        @media (min-width: 600px) {
            .grid-container {
                grid-template-columns: repeat(3, 1fr);
                gap: 18px;
            }
        }

        @media (min-width: 900px) {
            .grid-container {
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
            }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.15s ease-in-out;
            -webkit-tap-highlight-color: transparent;
        }

        .card:active {
            transform: scale(0.97);
        }

        .card-img-wrapper {
            width: 100%;
            padding-top: 133.33%; /* 3:4 비율 유지 */
            position: relative;
            background-color: #edf2f7;
        }

        .card-img-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-body {
            padding: 10px 8px;
            text-align: center;
            background-color: #fff;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 2px;
        }

        .card-sub {
            font-size: 0.75rem;
            color: #a0aec0;
        }

        /* 이미지 확대 모달 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            max-width: 95%;
            max-height: 90%;
            border-radius: 10px;
            object-fit: contain;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            color: #fff;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>성경 인물 카드 (24종)</h1>
        <p>카드를 터치하면 전체 화면으로 확대됩니다.</p>
    </div>

    <div class="grid-container" id="cardGrid">

    </div>

    <!-- 이미지 확대용 모달 -->

        // 동적으로 24개 카드 HTML 생성
        const grid = document.getElementById('cardGrid');
        cardsData.forEach(card => {
            const cardElement = document.createElement('div');
            cardElement.className = 'card';
            cardElement.onclick = () => openModal(card.image);
            
            cardElement.innerHTML = `
                <div class="card-img-wrapper">
                    <img src="${card.image}" alt="${card.name}">
                </div>
                <div class="card-body">
                    <div class="card-title">${card.name}</div>
                    <div class="card-sub">${card.verse}</div>
                </div>
            `;
            grid.appendChild(cardElement);
        });

        // 모달 열기/닫기
        function openModal(imgSrc) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            modalImg.src = imgSrc;
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('active');
        }
    </script>
</body>
</html>

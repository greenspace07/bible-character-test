<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>성경인물 유형 TEST</title>
    <style>
        :root {
            --primary-color: #6c5ce7;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #2d3436;
            --sub-text: #636e72;
            --accent-color: #a29bfe;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Screen Switch */
        .screen {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }
        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Start Screen */
        .start-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--primary-color);
        }
        .start-desc {
            font-size: 0.95rem;
            color: var(--sub-text);
            line-height: 1.5;
            margin-bottom: 24px;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            background-color: #e9ecef;
            height: 8px;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--primary-color);
            transition: width 0.3s ease;
        }

        .question-number {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 24px;
            line-height: 1.4;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 16px 20px;
            margin-bottom: 12px;
            border: 2px solid #edf2f7;
            background: var(--card-bg);
            border-radius: 12px;
            font-size: 0.95rem;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 1.4;
            text-align: left;
        }
        .btn:hover, .btn:active {
            border-color: var(--primary-color);
            background-color: #f3f0ff;
            color: var(--primary-color);
        }

        .primary-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            font-weight: 600;
            font-size: 1.05rem;
            text-align: center;
            padding: 16px;
        }
        .primary-btn:hover, .primary-btn:active {
            background-color: #5b4bc4;
            color: white;
        }

        /* Result Screen */
        .result-subtitle {
            font-size: 0.9rem;
            color: var(--sub-text);
            margin-bottom: 6px;
        }
        .result-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 16px;
        }
        .verse-box {
            background-color: #f3f0ff;
            border-left: 4px solid var(--primary-color);
            padding: 14px;
            border-radius: 0 10px 10px 0;
            font-size: 0.9rem;
            color: #4a4a4a;
            line-height: 1.5;
            margin-bottom: 20px;
            text-align: left;
        }
        .verse-ref {
            display: block;
            margin-top: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--primary-color);
            text-align: right;
        }
        .result-desc {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-color);
            margin-bottom: 24px;
            text-align: left;
            background: #fafafa;
            padding: 16px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. 시작 화면 -->
    <div id="start-screen" class="screen active">
        <div style="font-size: 3rem; margin-bottom: 10px;">📖</div>
        <h1 class="start-title">성경인물 유형 TEST</h1>
        <p class="start-desc">40가지 질문을 통해 나와 가장 닮은 성경 속 인물과 나에게 주시는 말씀 구절을 확인해 보세요!</p>
        <button class="btn primary-btn" onclick="startTest()">테스트 시작하기</button>
    </div>

    <!-- 2. 질문 화면 -->
    <div id="quiz-screen" class="screen">
        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div id="question-number" class="question-number">Q1 / 40</div>
        <div id="question-text" class="question-text">질문 내용이 여기에 들어갑니다.</div>
        <button id="btn-a" class="btn" onclick="selectAnswer('A')">A 선택지</button>
        <button id="btn-b" class="btn" onclick="selectAnswer('B')">B 선택지</button>
    </div>

    <!-- 3. 결과 화면 -->
    <div id="result-screen" class="screen">
        <p class="result-subtitle">나와 닮은 성경 인물은?</p>
        <h2 id="result-title" class="result-title">인물 이름</h2>
        
        <div class="verse-box">
            <span id="result-verse">성경 구절 본문</span>
            <span id="result-ref" class="verse-ref">(성경 장:절)</span>
        </div>

        <div id="result-desc" class="result-desc">
            유형 설명이 들어가는 공간입니다.
        </div>

        <button class="btn primary-btn" onclick="restartTest()">다시 테스트하기</button>
    </div>
</div>

            verse: "여호와는 나의 목자시니 내게 부족함이 없으리로다",
            ref: "(시편 23:1)",
            desc: "당신은 음악, 글, 감성을 통해 하나님을 향한 은혜를 아름답게 표현하는 창의표현형 인물입니다."
        },
        "바나바": {
            verse: "바나바는 착한 사람이요 성령과 믿음이 충만한 자라 이에 큰 무리가 주께 더하더라",
            ref: "(사도행전 11:24)",
            desc: "당신은 사람들을 격려하고 공동체 안에서 사랑으로 사람들을 묶어주는 관계중심형 인물입니다."
        },
        "아브라함": {
            verse: "여호와께서 아브람에게 이르시되 너는 너의 본토 친척과 아비 집을 떠나 내가 네게 지시할 땅으로 가라",
            ref: "(창세기 12:1)",
            desc: "당신은 하나님의 부르심을 따라 새로운 영역 도전과 선교적 삶을 두려워하지 않는 선교개척형 인물입니다."
        },
        "엘리야": {
            verse: "불 후에 세미한 소리가 있는지라 엘리야가 듣고 겉옷으로 얼굴을 가리우고",
            ref: "(열왕기상 19:12-13)",
            desc: "당신은 성령의 인도하심과 세미한 음성에 민감하며 직관적 감동으로 동행하는 예언직관형 인물입니다."
        },
        "에스라": {
            verse: "에스라가 여호와의 율법을 연구하여 준행하며 율례와 규례를 이스라엘에게 가르치기로 결심하였었더라",
            ref: "(에스라 7:10)",
            desc: "당신은 성경 말씀을 체계적으로 연구하고 깊이 묵상하는 것을 즐기는 성경탐구형 인물입니다."
        },
        "다비다": {
            verse: "욥바에 다비다라 하는 여제자가 있으니 그 이름을 번역하면 도르가라 선행과 구제하는 일이 심히 많더니",
            ref: "(사도행전 9:36)",
            desc: "당신은 따뜻한 손길로 주변의 연약한 이웃을 보살피고 구제하며 사랑을 몸소 실천하는 사랑실천형 인물입니다."
        },
        "바울": {
            verse: "내가 달려갈 길과 주 예수께 받은 사명 곧 하나님의 은혜의 복음을 증언하는 일을 마치려 함에는 나의 생명조차 조금도 귀한 것으로 여기지 아니하노라",
            ref: "(사도행전 20:24)",
            desc: "당신은 하나님의 원대한 비전을 품고 사명을 위해 열정적으로 달려가는 비전추구형 인물입니다."
        },
        "느헤미야": {
            verse: "내 하나님께서 내 마음을 감화하사 예루살렘을 위하여 무엇을 하게 하신 것을 내가 아무에게도 말하지 아니하고",
            ref: "(느헤미야 2:12)",
            desc: "당신은 주어진 자리에서 묵묵히 충성하며 맡은 임무를 실천으로 완수해 내는 실천봉사형 인물입니다."
        }
    };

    let currentQ = 0;
    let scores = {};

    function startTest() {
        currentQ = 0;
        scores = {};
        showScreen('quiz-screen');
        renderQuestion();
    }

    function renderQuestion() {
        const qData = questions[currentQ];
        document.getElementById('question-number').innerText = `Q${currentQ + 1} / ${questions.length}`;
        document.getElementById('question-text').innerText = qData.q === "선택해 주세요." ? `Q${currentQ + 1}. 알맞은 항목을 선택해 주세요.` : qData.q;
        document.getElementById('btn-a').innerText = qData.a;
        document.getElementById('btn-b').innerText = qData.b;

        const progressPercent = ((currentQ) / questions.length) * 100;
        document.getElementById('progress-bar').style.width = `${progressPercent}%`;
    }

    function selectAnswer(choice) {
        const qData = questions[currentQ];
        const selectedType = choice === 'A' ? qData.typeA : qData.typeB;

        scores[selectedType] = (scores[selectedType] || 0) + 1;

        currentQ++;
        if (currentQ < questions.length) {
            renderQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        let maxScore = -1;
        let resultChar = "";

        for (const char in scores) {
            if (scores[char] > maxScore) {
                maxScore = scores[char];
                resultChar = char;
            }
        }

        const data = characterData[resultChar] || characterData["디모데"];

        document.getElementById('result-title').innerText = resultChar;
        document.getElementById('result-verse').innerText = `"${data.verse}"`;
        document.getElementById('result-ref').innerText = data.ref;
        document.getElementById('result-desc').innerText = data.desc;

        showScreen('result-screen');
    }

    function restartTest() {
        showScreen('start-screen');
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }
</script>
</body>
</html>
